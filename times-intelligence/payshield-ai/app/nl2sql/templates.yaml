- id: net_pay_trend
  title: Net pay per month (trend)
  slots: {n: 12}
  sql: |
    SELECT pp.value AS period, count(*) AS employees, round(sum(@NET@), 2) AS total_net_pay
    FROM @RUNS@
    WHERE to_date(pp.value, 'MM/YYYY') > (SELECT max(to_date(p2.value, 'MM/YYYY')) FROM payroll.pay_period p2
                                          JOIN payroll.pay_run r2 ON r2.pay_period_id = p2.id WHERE p2.company_id = %(c)s)
                                         - make_interval(months => %(n)s)
    GROUP BY pp.value ORDER BY to_date(pp.value, 'MM/YYYY')
  phrasings:
    - show net pay for the last 12 months
    - payroll trend over the past 6 months
    - monthly net pay history
    - how has total pay changed over the year
