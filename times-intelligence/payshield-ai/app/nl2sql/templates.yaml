- id: pay_run_status
  title: Pay runs and their status for a month
  slots: {period: latest}
  sql: |
    SELECT r.name AS pay_run, r.code, pp.value AS period, r.pay_run_date::date AS pay_date, r.is_lock AS locked,
           st.name AS record_status, count(pr.id) AS records
    FROM payroll.pay_run r JOIN payroll.pay_period pp ON pp.id = r.pay_period_id AND pp.company_id = %(c)s
    LEFT JOIN payroll.pay_record pr ON pr.pay_run_id = r.id
    LEFT JOIN payroll.lk_pay_run_status st ON st.id = pr.status_id
    WHERE @IN_PERIOD@
    GROUP BY r.id, r.name, r.code, pp.value, r.pay_run_date, r.is_lock, st.name ORDER BY r.id
