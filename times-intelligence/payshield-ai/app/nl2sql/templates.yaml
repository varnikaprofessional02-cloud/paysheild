# Question catalogue for text -> SQL without an LLM.
# Each intent: a fixed, read-only SQL template + the slots it takes + example phrasings the classifier learns from.
#   slots: period (a month; "latest" = the latest month with a pay run), n, amount, days, employee ("required" = must be in the question)
#   SQL parameters: %(c)s company id (always from the session, never from the text), %(period)s first day of the month,
#   %(n)s, %(amount)s, %(days)s, %(emp)s ('%text%'). @MACROS@ are expanded in catalog.py.
# Add a question type: add an intent with its SQL and 15+ phrasings, then run scripts/nl2sql_train.py.

intents:

# ---------------------------------------------------------------- payroll
- id: net_pay_total
  title: Total net pay for a month
  slots: {period: latest}
  sql: |
    SELECT pp.value AS period, count(*) AS employees, round(sum(@NET@), 2) AS total_net_pay
    FROM @RUNS@ WHERE @IN_PERIOD@ GROUP BY pp.value
  phrasings:
    - what is the total net pay for september 2026
    - total net pay this month
    - how much net pay did we pay last month
    - sum of net salary for oct
    - total take home pay for the month
    - how much are we paying out in net pay in august
