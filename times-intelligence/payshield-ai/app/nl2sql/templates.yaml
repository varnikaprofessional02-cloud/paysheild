- id: headcount_by_department
  title: Active employees by department
  slots: {}
  sql: |
    SELECT coalesce(d.description, d.code, '(none)') AS department, count(DISTINCT ucc.user_id) AS employees
    FROM employee.user_company_contract ucc
    LEFT JOIN LATERAL (SELECT cp.department_id FROM employee.career_progression cp WHERE cp.contract_id = ucc.id
                       AND cp.effective_date <= current_date ORDER BY cp.effective_date DESC, cp.id DESC LIMIT 1) cp ON true
    LEFT JOIN company.code_setup d ON d.id = cp.department_id
    WHERE ucc.company_id = %(c)s AND ucc.is_active
      AND (ucc.contract_end_date IS NULL OR ucc.contract_end_date >= current_date)
    GROUP BY 1 ORDER BY employees DESC
  phrasings:
    - headcount by department
    - how many employees in each department
    - staff count per department
    - which department has the most people
    - department sizes
    - number of employees by department
    - show headcount split by department
