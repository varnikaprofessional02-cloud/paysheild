- id: employee_profile
  title: Profile of one employee
  slots: {employee: required}
  sql: |
    SELECT ucc.employee_no, trim(u.first_name || ' ' || u.last_name) AS name, ucc.contract_id AS contract,
           ucc.contract_start_date::date AS start_date, ucc.contract_end_date::date AS end_date, ucc.is_active AS active,
           ur.residency_type::text AS residency, x.last_day::date AS last_day
    FROM employee.user_company_contract ucc JOIN security."user" u ON u.id = ucc.user_id
    LEFT JOIN employee.user_regulatory ur ON ur.user_id = ucc.user_id
    LEFT JOIN LATERAL (SELECT min(cr.last_day_of_work) AS last_day FROM employee.contract_resignation cr
                       WHERE cr.contract_id = ucc.id) x ON true
    WHERE ucc.company_id = %(c)s AND (ucc.employee_no ILIKE %(emp)s OR (u.first_name || ' ' || u.last_name) ILIKE %(emp)s)
    ORDER BY ucc.contract_start_date DESC
  phrasings:
    - tell me about E0012
    - who is EMP0042
    - employee details for John Tan
    - when did E0105 join
    - is Mei Ling still active
    - profile of employee E0007
    - what is Ahmad Rahman's residency
