- id: paid_after_leaving
  title: Employees paid after their last day of work
  slots: {period: latest}
  sql: |
    SELECT ucc.employee_no, trim(u.first_name || ' ' || u.last_name) AS name, x.last_day::date AS last_day,
           round(@NET@, 2) AS net_paid
    FROM @RUNS@ @EMP_JOIN@
    JOIN LATERAL (SELECT min(cr.last_day_of_work) AS last_day FROM employee.contract_resignation cr
                  WHERE cr.contract_id = ucc.id) x ON x.last_day IS NOT NULL
    WHERE @IN_PERIOD@ AND x.last_day < %(period)s::date AND @NET@ > 0
    ORDER BY x.last_day
  phrasings:
    - who was paid after leaving
    - employees paid after their last day this month
    - resigned staff still on payroll
    - are we paying anyone who already left
