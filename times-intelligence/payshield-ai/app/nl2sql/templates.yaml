- id: month_change
  title: This month vs previous month
  slots: {period: latest}
  sql: |
    WITH m AS (SELECT to_date(pp.value, 'MM/YYYY') AS period, count(*) AS employees, sum(@NET@) AS net
               FROM @RUNS@
               WHERE to_date(pp.value, 'MM/YYYY') IN (%(period)s::date, (%(period)s::date - interval '1 month')::date)
               GROUP BY 1)
    SELECT to_char(cur.period, 'MM/YYYY') AS period, cur.employees, round(cur.net, 2) AS net,
           to_char(prev.period, 'MM/YYYY') AS previous_period, prev.employees AS previous_employees,
           round(prev.net, 2) AS previous_net, round(cur.net - prev.net, 2) AS change,
           round(100 * (cur.net - prev.net) / NULLIF(prev.net, 0), 1) AS change_pct
    FROM m cur LEFT JOIN m prev ON prev.period = (cur.period - interval '1 month')::date
    WHERE cur.period = %(period)s::date
  phrasings:
    - how does this month compare to last month
    - change in net pay from august to september
    - payroll increase compared with the previous month
    - month on month change in payroll
    - why is payroll higher than last month
    - difference between this month and last month pay
    - variance against previous month
    - is september payroll up or down
    - compare oct payroll with sep
    - how much did payroll go up this month
    - payroll movement versus prior month
    - percentage change in net pay this month
    - did total pay drop compared to last month
    - net pay change vs previous period
    - mom variance of payroll

