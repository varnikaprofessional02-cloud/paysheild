- id: work_pass_expiring
  title: Work passes expiring soon
  slots: {days: 30}
  sql: |
    SELECT ucc.employee_no, trim(u.first_name || ' ' || u.last_name) AS name, cs.code AS pass_type,
           w.pass_expiry_date AS expires_on, w.pass_expiry_date - current_date AS days_left
    FROM employee.epm_work_pass_records w
    JOIN employee.user_regulatory ur ON ur.id = w.regulatory_id
    JOIN employee.user_company_contract ucc ON ucc.user_id = ur.user_id AND ucc.company_id = %(c)s AND ucc.is_active
    JOIN security."user" u ON u.id = ucc.user_id
    LEFT JOIN company.code_setup cs ON cs.id = w.work_pass_id
    WHERE w.cancellation_date IS NULL
      AND w.pass_expiry_date BETWEEN current_date AND current_date + %(days)s::int
    ORDER BY w.pass_expiry_date
  phrasings:
    - which work passes expire in the next 30 days
